name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NUXT_PUBLIC_SITE_NAME: EasyTV
      NUXT_PUBLIC_API_BASE_URL: http://localhost:8383
      NUXT_PUBLIC_SITE_URL: http://localhost:3005
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: cp .env.example .env.production && pnpm build
